name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
        env:
          ANTIGRAVITY_GATEWAY_CONFIG_DIR: ${{ runner.temp }}/gateway-test-config
      - run: npm pack --dry-run

  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            manager/server/package-lock.json
            manager/web/package-lock.json
      - run: npm ci --prefix manager/server --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix manager/web --ignore-scripts --no-audit --no-fund
      - run: npm run manager:check
      - run: npm run manager:test
      - run: npm run manager:build
